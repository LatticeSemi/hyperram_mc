  <H1>HyperRAM Memory Controller</H1>

  <H2>Description</H2>
  <P> This HyperRAM Memory Controller provides a hyperbus interface between a processor and an off-chip HyperRAM device. </P>

  <H2>Devices Supported</H2>
  <P>LIFCL, LFD2NX, LFCPNX, LFMXO5</P>
