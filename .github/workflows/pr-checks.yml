name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

# Prevent multiple runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for trailing whitespace
        run: |
          echo "Checking for trailing whitespace..."
          if git diff --check HEAD^ HEAD; then
            echo "✅ No trailing whitespace found"
          else
            echo "❌ Trailing whitespace detected"
            exit 1
          fi

      - name: Check for tabs (should use spaces)
        run: |
          echo "Checking for tab characters..."
          if find rtl/ -name "*.v" -o -name "*.sv" | xargs grep -P '\t'; then
            echo "❌ Tab characters found. Please use spaces."
            exit 1
          else
            echo "✅ No tab characters found"
          fi

      - name: Check line endings (should be LF)
        run: |
          echo "Checking line endings..."
          if find rtl/ -name "*.v" -o -name "*.sv" | xargs file | grep CRLF; then
            echo "❌ CRLF line endings found. Please use LF."
            exit 1
          else
            echo "✅ All files use LF line endings"
          fi

  # Job 2: RTL Lint Checks
  rtl-lint:
    name: RTL Lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Lint Verilog files
        run: |
          echo "Running Verilator lint..."
          find rtl/ -name "*.v" | while read file; do
            echo "Linting $file..."
            verilator --lint-only -Wall "$file" || exit 1
          done
          echo "✅ All RTL files passed lint checks"

  # Job 3: XML Validation
  xml-validation:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate XML files
        run: |
          echo "Validating XML files..."
          xmllint --noout metadata.xml && echo "✅ metadata.xml valid"
          xmllint --noout bus_interface.xml && echo "✅ bus_interface.xml valid"
          xmllint --noout memory_map.xml && echo "✅ memory_map.xml valid"
          xmllint --noout doc/introduction.html && echo "✅ introduction.html valid"

  # Job 4: Version Format Check
  version-check:
    name: Version Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify metadata.xml version format
        run: |
          VERSION=$(grep '<lsccip:version>' metadata.xml | sed 's/.*<lsccip:version>\(.*\)<\/lsccip:version>.*/\1/' | tr -d '[:space:]')
          echo "Current version: $VERSION"

          # Validate format (X.Y.Z or X.Y.Z.##)
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]{2})?$ ]]; then
            echo "✅ Valid version format: $VERSION"
          else
            echo "❌ Invalid version format: $VERSION"
            echo "Expected: X.Y.Z or X.Y.Z.##"
            exit 1
          fi

  # Job 5: RTL Simulation (QuestaSim/ModelSim)
  rtl-simulation:
    name: RTL Simulation
    runs-on: ubuntu-latest
    # Note: Configure with self-hosted runner for actual simulation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulation Check (Configure with actual tools)
        run: |
          echo "🔧 Simulation placeholder - configure for your environment"
          echo "For production: Use self-hosted runner with QuestaSim/ModelSim"
          echo "✅ Simulation check configured"

  # Summary job - requires all checks to pass
  pr-status:
    name: PR Status Summary
    runs-on: ubuntu-latest
    needs: [code-quality, rtl-lint, xml-validation, version-check, rtl-simulation]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.rtl-lint.result }}" != "success" ] || \
             [ "${{ needs.xml-validation.result }}" != "success" ] || \
             [ "${{ needs.version-check.result }}" != "success" ] || \
             [ "${{ needs.rtl-simulation.result }}" != "success" ]; then
            echo "❌ Some PR checks failed"
            exit 1
          else
            echo "✅ All PR checks passed!"
          fi

